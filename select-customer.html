<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>選擇顧客｜新增美睫紀錄</title>
<style>
:root{--bg:#f4efeb;--paper:#fffdfb;--text:#302a27;--muted:#8a7f78;--line:#e7ddd7;--accent:#8b645a;--accent-soft:#f2e7e2;--soft:#faf6f3;--shadow:0 10px 26px rgba(79,59,48,.08)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","Microsoft JhengHei",sans-serif}.wrap{max-width:820px;margin:28px auto;padding:0 18px}.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:26px}.back{display:inline-flex;color:#786b65;text-decoration:none;font-size:14px;font-weight:700;margin-bottom:12px}.back:hover{color:var(--accent)}h1{margin:0;text-align:center;font-size:25px;letter-spacing:.06em}.dash{width:60%;margin:18px auto 22px;border-top:1.5px dashed #b9aaa2}.intro{text-align:center;color:var(--muted);font-size:14px;margin:-4px 0 22px}.search{position:relative;margin-bottom:20px}.search input{width:100%;height:48px;border:1px solid var(--line);border-radius:12px;background:#fff;padding:0 16px 0 44px;font-size:16px;outline:none}.search input:focus{border-color:#aa8178;box-shadow:0 0 0 3px rgba(139,100,90,.10)}.search-icon{position:absolute;left:16px;top:13px;color:var(--muted);font-size:18px}.section-head{display:flex;align-items:center;justify-content:space-between;margin:6px 0 10px}.section-title{font-size:15px;font-weight:800}.section-note{font-size:12px;color:var(--muted)}.customer-list{display:grid;gap:9px}.customer{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:14px 15px;border:1px solid #eee4de;border-radius:13px;background:#fff;text-decoration:none;color:inherit;transition:.15s}.customer:hover{border-color:#cdb8af;background:#fdf9f7;transform:translateY(-1px)}.name{font-weight:800;margin-bottom:4px}.meta{font-size:12px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap}.choose{color:var(--accent);font-size:13px;font-weight:800}.empty{display:none;text-align:center;padding:26px 10px;color:var(--muted);font-size:14px}.new-customer{margin-top:22px;padding-top:18px;border-top:1px dashed var(--line);display:flex;align-items:center;justify-content:space-between;gap:14px}.new-copy strong{display:block;font-size:14px;margin-bottom:4px}.new-copy span{font-size:12px;color:var(--muted)}.btn{display:inline-flex;align-items:center;justify-content:center;min-height:42px;padding:10px 15px;border-radius:11px;text-decoration:none;font-size:14px;font-weight:800;white-space:nowrap}.btn-primary{background:var(--accent);color:#fff}@media(max-width:600px){.wrap{margin:12px auto;padding:0 10px}.card{padding:18px 14px;border-radius:14px}h1{font-size:22px}.dash{width:82%;margin:15px auto 18px}.customer{padding:13px}.new-customer{align-items:stretch;flex-direction:column}.btn{width:100%}}
</style>
</head>
<body><div class="wrap"><main class="card">
<a class="back" href="index.html">← 返回 Dashboard</a>
<h1>新增美睫紀錄</h1><div class="dash"></div><p class="intro">請先選擇本次服務的顧客，進入紀錄表後會自動帶入姓名。</p>
<div class="search"><span class="search-icon">⌕</span><input id="search" type="search" placeholder="搜尋顧客姓名或電話" autocomplete="off"></div>
<div class="section-head"><div class="section-title">顧客清單</div><div class="section-note">Prototype 假資料</div></div>
<div id="customerList" class="customer-list">
<a class="customer" href="record-form.html?name=王小美" data-search="王小美 0912345678"><div><div class="name">王小美</div><div class="meta"><span>0912-345-678</span><span>回訪客</span><span>上次 09/08</span></div></div><span class="choose">選擇 ›</span></a>
<a class="customer" href="record-form.html?name=李欣怡" data-search="李欣怡 0988123456"><div><div class="name">李欣怡</div><div class="meta"><span>0988-123-456</span><span>回訪客</span><span>上次 09/06</span></div></div><span class="choose">選擇 ›</span></a>
<a class="customer" href="record-form.html?name=陳語柔" data-search="陳語柔 0922333444"><div><div class="name">陳語柔</div><div class="meta"><span>0922-333-444</span><span>新客</span><span>尚無施作紀錄</span></div></div><span class="choose">選擇 ›</span></a>
<a class="customer" href="record-form.html?name=林佳蓉" data-search="林佳蓉 0933555666"><div><div class="name">林佳蓉</div><div class="meta"><span>0933-555-666</span><span>回訪客</span><span>上次 09/01</span></div></div><span class="choose">選擇 ›</span></a>
</div><div id="empty" class="empty">找不到符合的顧客，可以先建立新的顧客資料卡。</div>
<div class="new-customer"><div class="new-copy"><strong>找不到這位顧客？</strong><span>第一次來店的客人請先建立顧客資料卡。</span></div><a class="btn btn-primary" href="customer-form.html?return=record">＋ 新增顧客</a></div>
</main></div>
<script>
const search=document.getElementById('search');const rows=[...document.querySelectorAll('.customer')];const empty=document.getElementById('empty');search.addEventListener('input',()=>{const q=search.value.trim().toLowerCase().replace(/[-\s]/g,'');let visible=0;rows.forEach(row=>{const text=(row.dataset.search||'').toLowerCase().replace(/[-\s]/g,'');const show=!q||text.includes(q);row.style.display=show?'grid':'none';if(show)visible++});empty.style.display=visible?'none':'block'});
</script></body></html>
