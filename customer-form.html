ignature-legacy-holder';legacyHolder.setAttribute('aria-hidden','true');legacyHolder.appendChild(legacyCanvas);legacyHolder.appendChild(legacyClear);d.body.insertBefore(legacyHolder,d.body.lastElementChild);sigBlock.innerHTML=`<div id="signaturePreviewBox" class="signature-preview"><span class="signature-placeholder">尚未簽名</span><img id="signaturePreview" alt="顧客簽名"></div><button id="openSignature" class="open-signature" type="button">點擊簽名</button>`;const modal=d.createElement('div');modal.id='signatureModal';modal.className='signature-modal';modal.hidden=true;modal.innerHTML=`<div class="signature-dialog" role="dialog" aria-modal="true" aria-label="顧客簽名"><div class="signature-dialog-head"><div class="signature-dialog-title">顧客簽名</div><button id="closeSignature" class="signature-close" type="button" aria-label="關閉">×</button></div><div class="signature-canvas-wrap"><canvas id="signaturePopupPad" class="signature-popup-pad"></canvas></div><div class="signature-dialog-actions"><button id="signatureClear" class="signature-clear" type="button">清除簽名</button><button id="signatureDone" class="signature-done" type="button">完成</button></div></div>`;d.body.insertBefore(modal,d.body.lastElementChild);const extra=d.createElement('script');extra.textContent=`(()=>{const modal=document.getElementById('signatureModal');const openBtn=document.getElementById('openSignature');const closeBtn=document.getElementById('closeSignature');const doneBtn=document.getElementById('signatureDone');const clearBtn=document.getElementById('signatureClear');const pad=document.getElementById('signaturePopupPad');const preview=document.getElementById('signaturePreview');const box=document.getElementById('signaturePreviewBox');const ctx=pad.getContext('2d',{alpha:true,desynchronized:true});let savedImage='';let hasInk=false;let lockedNodes=[];let padLeft=0,padTop=0,scaleX=1,scaleY=1;let drawing=false,lastX=0,lastY=0;let touchId=null;let pointerId=null;let activeSource='';function lockBackground(){locked
