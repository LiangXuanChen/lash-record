<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>美睫顧客資料卡</title></head><body><script>(async()=>{const r=await fetch('customer-form-base.html');const t=await r.text();const d=new DOMParser().parseFromString(t,'text/html');const walk=d.querySelector('input[value="路過"]');if(walk)walk.closest('label')?.remove();const sec=[...d.querySelectorAll('section')].find(s=>s.querySelector('.section-title')?.textContent.trim()==='睫毛狀況');if(sec){const grid=[...sec.children].find(el=>el.classList?.contains('grid'));const firstStatus=[...sec.children].find(el=>el.classList?.contains('status-group'));if(grid&&firstStatus)sec.insertBefore(grid,firstStatus);}const style=d.querySelector('style');if(style){style.textContent+=`.readonly-box{pointer-events:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}.signature-block{user-select:none;-webkit-user-select:none}.signature-preview{height:150px;border:1px solid var(--line);border-radius:12px;background:#fff;display:grid;place-items:center;overflow:hidden;padding:10px}.signature-preview img{display:none;max-width:100%;max-height:100%;object-fit:contain}.signature-preview.has-signature img{display:block}.signature-preview.has-signature .signature-placeholder{display:none}.signature-placeholder{color:var(--muted);font-size:13px}.open-signature{margin-top:10px;border:0;border-radius:10px;background:var(--accent);color:#fff;padding:10px 16px;font-family:inherit;font-weight:700;cursor:pointer}.signature-modal[hidden]{display:none}.signature-modal{position:fixed;inset:0;z-index:9999;background:rgba(48,42,39,.55);display:flex;align-items:center;justify-content:center;padding:20px}.signature-dialog{width:min(920px,100%);height:min(680px,calc(100vh - 40px));background:var(--paper);border-radius:18px;box-shadow:0 18px 60px rgba(0,0,0,.25);display:flex;flex-direction:column;padding:18px;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}.signature-dialog-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}.signature-dialog-title{font-size:18px;font-weight:700}.signature-close{border:0;background:transparent;font-size:28px;line-height:1;color:var(--muted);padding:4px 8px;cursor:pointer}.signature-canvas-wrap{flex:1;min-height:0;display:flex}.signature-dialog .signature-pad{width:100%;height:100%;min-height:320px;touch-action:none;overscroll-behavior:contain;border:1px solid var(--line);border-radius:14px;background:#fff}.signature-dialog-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:12px}.signature-dialog-actions button{border-radius:10px;padding:10px 18px;font-family:inherit;font-weight:700;cursor:pointer}.signature-dialog-actions .clear-signature{border:1px solid var(--line);background:#fff;color:var(--text)}.signature-done{border:0;background:var(--accent);color:#fff}@media(max-width:767px){.signature-modal{padding:0}.signature-dialog{width:100%;height:100%;border-radius:0;padding:14px}.signature-dialog .signature-pad{min-height:0}.signature-preview{height:130px}}`;}const sigBlock=d.querySelector('.signature-block');const canvas=d.getElementById('signaturePad');const clearBtn=d.getElementById('clearSignature');if(sigBlock&&canvas&&clearBtn){sigBlock.innerHTML=`<div id="signaturePreviewBox" class="signature-preview"><span class="signature-placeholder">尚未簽名</span><img id="signaturePreview" alt="顧客簽名"></div><button id="openSignature" class="open-signature" type="button">點擊簽名</button>`;const modal=d.createElement('div');modal.id='signatureModal';modal.className='signature-modal';modal.hidden=true;modal.innerHTML=`<div class="signature-dialog" role="dialog" aria-modal="true" aria-label="顧客簽名"><div class="signature-dialog-head"><div class="signature-dialog-title">顧客簽名</div><button id="closeSignature" class="signature-close" type="button" aria-label="關閉">×</button></div><div class="signature-canvas-wrap"></div><div class="signature-dialog-actions"></div></div>`;modal.querySelector('.signature-canvas-wrap').appendChild(canvas);modal.querySelector('.signature-dialog-actions').appendChild(clearBtn);const done=d.createElement('button');done.id='signatureDone';done.className='signature-done';done.type='button';done.textContent='完成';modal.querySelector('.signature-dialog-actions').appendChild(done);d.body.insertBefore(modal,d.body.lastElementChild);const extra=d.createElement('script');extra.textContent=`(()=>{const modal=document.getElementById('signatureModal');const openBtn=document.getElementById('openSignature');const closeBtn=document.getElementById('closeSignature');const doneBtn=document.getElementById('signatureDone');const canvas=document.getElementById('signaturePad');const preview=document.getElementById('signaturePreview');const box=document.getElementById('signaturePreviewBox');const clearBtn=document.getElementById('clearSignature');let savedImage='';function resizePadForPopup(){requestAnimationFrame(()=>{const ratio=Math.max(window.devicePixelRatio||1,1);const rect=canvas.getBoundingClientRect();if(!rect.width||!rect.height)return;let previous='';if(savedImage)previous=savedImage;else if(typeof hasSignature!=='undefined'&&hasSignature)previous=canvas.toDataURL('image/png');canvas.width=Math.round(rect.width*ratio);canvas.height=Math.round(rect.height*ratio);signatureCtx.setTransform(ratio,0,0,ratio,0,0);signatureCtx.lineWidth=2;signatureCtx.lineCap='round';signatureCtx.lineJoin='round';signatureCtx.strokeStyle='#302a27';if(previous){const img=new Image();img.onload=()=>signatureCtx.drawImage(img,0,0,rect.width,rect.height);img.src=previous;}})}function openModal(){modal.hidden=false;document.body.style.overflow='hidden';resizePadForPopup();}function closeModal(){modal.hidden=true;document.body.style.overflow='';}openBtn.addEventListener('click',openModal);closeBtn.addEventListener('click',closeModal);doneBtn.addEventListener('click',()=>{if(typeof hasSignature!=='undefined'&&hasSignature){savedImage=canvas.toDataURL('image/png');preview.src=savedImage;box.classList.add('has-signature');openBtn.textContent='重新簽名';}closeModal();});clearBtn.addEventListener('click',()=>{savedImage='';preview.removeAttribute('src');box.classList.remove('has-signature');openBtn.textContent='點擊簽名';});modal.addEventListener('pointerdown',e=>{if(e.target===modal)e.preventDefault();});})();`;d.body.appendChild(extra);}document.open();document.write('<!doctype html>'+d.documentElement.outerHTML);document.close();})().catch(()=>{document.body.textContent='頁面載入失敗，請重新整理。';});</script></body></html>
