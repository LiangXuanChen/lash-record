<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>美睫顧客資料卡</title></head><body><script>(async()=>{const r=await fetch('customer-form-base.html');const t=await r.text();const d=new DOMParser().parseFromString(t,'text/html');const walk=d.querySelector('input[value="路過"]');if(walk)walk.closest('label')?.remove();const sec=[...d.querySelectorAll('section')].find(s=>s.querySelector('.section-title')?.textContent.trim()==='睫毛狀況');if(sec){const grid=[...sec.children].find(el=>el.classList?.contains('grid'));const firstStatus=[...sec.children].find(el=>el.classList?.contains('status-group'));if(grid&&firstStatus)sec.insertBefore(grid,firstStatus);}document.open();document.write('<!doctype html>'+d.documentElement.outerHTML);document.close();})().catch(()=>{document.body.textContent='頁面載入失敗，請重新整理。';});</script></body></html>
