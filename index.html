<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>美睫顧客管理 Dashboard</title>
  <link rel="stylesheet" href="dashboard.css">
</head>
<body>
  <main class="dashboard-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">LASH RECORD</p>
        <h1>美睫顧客管理</h1>
        <p class="subtitle">顧客資料、施作紀錄與日常營運一頁掌握。</p>
      </div>
      <a class="primary-btn" href="customer-form.html">＋ 新增顧客</a>
    </header>

    <section class="stats-grid" aria-label="營運摘要">
      <article class="stat-card"><span>顧客總數</span><strong id="customerCount">3</strong><small>目前建立的顧客</small></article>
      <article class="stat-card"><span>本月來店</span><strong>12</strong><small>較上月 +2</small></article>
      <article class="stat-card"><span>本月營收</span><strong>$18,600</strong><small>測試資料</small></article>
      <article class="stat-card"><span>今日預約</span><strong>3</strong><small>待完成 2 位</small></article>
    </section>

    <section class="content-grid">
      <article class="panel quick-panel">
        <div class="panel-title-row"><div><p class="section-kicker">QUICK ACTIONS</p><h2>快速操作</h2></div></div>
        <div class="quick-actions">
          <a href="customer-form.html" class="quick-card"><span class="quick-icon">＋</span><div><strong>新增顧客</strong><small>建立美睫顧客資料卡</small></div></a>
          <a href="record-form.html?name=王小美" class="quick-card"><span class="quick-icon">✦</span><div><strong>新增施作紀錄</strong><small>直接進入美睫紀錄表</small></div></a>
        </div>
      </article>

      <article class="panel">
        <div class="panel-title-row"><div><p class="section-kicker">CUSTOMERS</p><h2>最近顧客</h2></div><input id="customerSearch" class="search" type="search" placeholder="搜尋姓名或電話"></div>
        <div id="customerList" class="customer-list"></div>
      </article>
    </section>
  </main>
  <script src="dashboard.js"></script>
</body>
</html>
