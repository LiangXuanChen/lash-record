<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>美睫設定</title>
  <link rel="stylesheet" href="settings.css">
</head>
<body>
<div class="settings-wrap">
  <header class="settings-header">
    <a class="back-link" href="index.html">← 返回 Dashboard</a>
    <div>
      <h1>美睫項目設定</h1>
    </div>
  </header>

  <main class="settings-grid">
    <section class="setting-card" data-key="lashStyles">
      <div class="card-head">
        <div>
          <h2>接睫樣式</h2>
          <p>例如：可愛型、性感型、華麗型、無辜型</p>
        </div>
      </div>
      <div class="item-list" id="lashStylesList"></div>
      <div class="add-row">
        <input id="lashStylesInput" type="text" placeholder="輸入新的接睫樣式">
        <button type="button" data-add="lashStyles">＋ 新增</button>
      </div>
    </section>

    <section class="setting-card" data-key="lashTypes">
      <div class="card-head">
        <div>
          <h2>睫毛種類</h2>
          <p>例如：YY 毛、山茶花、扁毛</p>
        </div>
      </div>
      <div class="item-list" id="lashTypesList"></div>
      <div class="add-row">
        <input id="lashTypesInput" type="text" placeholder="輸入新的睫毛種類">
        <button type="button" data-add="lashTypes">＋ 新增</button>
      </div>
    </section>

    <section class="setting-card" data-key="curls">
      <div class="card-head">
        <div>
          <h2>捲度</h2>
          <p>設定施作時常用的睫毛捲度</p>
        </div>
      </div>
      <div class="item-list" id="curlsList"></div>
      <div class="add-row">
        <input id="curlsInput" type="text" placeholder="例如：C、CC">
        <button type="button" data-add="curls">＋ 新增</button>
      </div>
    </section>

    <section class="setting-card" data-key="lengths">
      <div class="card-head">
        <div>
          <h2>長度</h2>
          <p>設定施作時常用的睫毛長度</p>
        </div>
      </div>
      <div class="item-list" id="lengthsList"></div>
      <div class="add-row">
        <input id="lengthsInput" type="text" inputmode="decimal" placeholder="例如：9 mm">
        <button type="button" data-add="lengths">＋ 新增</button>
      </div>
    </section>
  </main>

  <div class="save-note">目前先以瀏覽器本機資料保存設定；未來接上資料庫後，這四組設定可直接提供給美睫紀錄表的下拉選單使用。</div>
</div>
<script src="settings.js"></script>
</body>
</html>
